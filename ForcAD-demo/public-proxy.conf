events {}
http {
  server {
    listen 8080;
    location = / { proxy_pass http://nginx:80; }
    location = /arena.css { proxy_pass http://nginx:80; }
    location = /arena.js { proxy_pass http://nginx:80; }
    location = /submit.html { proxy_pass http://nginx:80; }
    location = /round-control.js { proxy_pass http://nginx:80; }
    location = /tick-display.js { proxy_pass http://nginx:80; }
    location ^~ /assets/ { proxy_pass http://nginx:80; }
    location ^~ /api/client/ { proxy_pass http://nginx:80; }
    location = /flags/ { proxy_pass http://nginx:80; }
    location ^~ /api/events/ { proxy_pass http://nginx:80; }
    location ^~ /socket.io/ {
      proxy_pass http://nginx:80;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_read_timeout 3600s;
    }
    location / { return 403; }
  }
}
